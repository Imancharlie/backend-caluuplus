<!DOCTYPE html>
<html>
<head>
    <title>Test Staff Roles Endpoint</title>
</head>
<body>
    <h1>Test Staff Roles Endpoint</h1>
    <button onclick="testEndpoint()">Test GET /api/staff/me/roles/</button>
    <div id="result"></div>

    <script>
        async function testEndpoint() {
            const token = 'your_jwt_token_here'; // Replace with actual token

            try {
                const response = await fetch('http://localhost:8000/api/staff/me/roles/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h2>Response (${response.status}):</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Error:</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
